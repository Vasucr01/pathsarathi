<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Mentors | PathSarathi</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
</head>

<body>

<h1 style="text-align:center; margin:20px;">Our Mentors</h1>

<div class="mentors">

  <div class="card" onclick="openModal('vasu')">
    <img src="images/vasu.jpg">
    <h3>Vasu Chauhan</h3>
    <p>Project Expert</p>
  </div>

  <div class="card" onclick="openModal('nitya')">
    <img src="images/nitya.jpeg">
    <h3>Nitya Bhambhani</h3>
    <p>Career Strategist</p>
  </div>

  <div class="card" onclick="openModal('jayvina')">
    <img src="images/jayvina.JPG">
    <h3>Jayvina Dhedhi</h3>
    <p>IT Mentor</p>
  </div>

  <div class="card" onclick="openModal('shiv')">
    <img src="images/SHIV.jpeg">
    <h3>Shiv Hansaliya</h3>
    <p>Travel Mentor</p>
  </div>

  <div class="card" onclick="openModal('hasti')">
    <img src="images/hasti.jpeg">
    <h3>Hasti Hirpara</h3>
    <p>Drawing & Painting Artist</p>
  </div>

</div>

<!-- MODAL -->
<div id="mentorModal" class="modal">
  <div class="modal-box">
    <span class="close" onclick="closeModal()">×</span>

    <img id="mentor-img">
    <h2 id="mentor-name"></h2>
    <p id="mentor-role"></p>
    <p id="mentor-bio"></p>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
